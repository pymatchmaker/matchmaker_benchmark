name: matchmaker-benchmark

channels:
  - anaconda
  - pytorch
  - defaults
  - conda-forge

dependencies:
  - python=3.12
  - Cython==3.0.11
  - matplotlib==3.9.2
  - numpy==1.26.4
  - ipython==9.11.0
  - pytorch==2.4.1
  - scipy==1.14.1
  - tqdm==4.66.5
  - wandb==0.18
  - pip

  - pip:
    - pyaudio==0.2.14
    - fastdtw==0.3.4
    - librosa==0.10.2
    - midi2audio==0.1.1
    - mido==1.3.2
    - pandas==2.2.3
    - python-rtmidi==1.5.8
    - git+https://github.com/CPJKU/madmom.git
    - pyyaml==6.0.2
    - partitura==1.8.0
    - python-hiddenmarkov==0.1.3
    - soundfile==0.12.1
    # synctoolbox==1.3.2 — install separately with: pip install --no-deps synctoolbox==1.3.2
    # (requires pandas<2.0 but works fine with pandas 2.x at runtime)
    - tabulate==0.9.0
    - pydantic-settings

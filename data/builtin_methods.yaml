# The methods that ship with matchmaker, described so they can appear on the
# leaderboard as reference points rather than as submissions.
#
# These are what a new score follower is trying to beat. They are evaluated by
# exactly the same code and on exactly the same fold — see docs/eval-protocol.md
# — and marked `reference` on the leaderboard so they are not mistaken for
# community entries.
#
#   python matchmaker_eval/run_submission.py --method pthmm --input-type midi
#
# Descriptions and attributions follow matchmaker's own README.
#
# `bib` is the entry's key in the Score Following Bibliography
# (https://pymatchmaker.github.io/score-following-bibliography/). The
# leaderboard links each reference's citation to that entry.

midi:
  dannenberg:
    name: Dynamic programming (Bloch and Dannenberg)
    authors: ["Bloch and Dannenberg (1985)"]
    bib: Bloch1985Real
    description: >
      Dynamic grouping of individual MIDI notes against score chords, using
      a dynamic-programming rating for matched, missing and extra notes.
      Reports a match when its rating exceeds the previous maximum.

  pthmm:
    name: Pitch HMM
    authors: ["Cancino-Chacón et al. (2023)"]
    bib: CancinoChacon2023Accompanion
    description: >
      Pitch-only variant of the ACCompanion's HMM, without its
      inter-onset-interval term: score onsets and inserted states between them,
      with Bernoulli pitch observations. Matchmaker's default MIDI method.
  hmm:
    name: Pitch-IOI HMM
    authors: [Cancino-Chacón et al. (2023)]
    bib: CancinoChacon2023Accompanion
    description: >
      Hidden Markov model combining pitch observations with inter-onset
      intervals and a Kalman tempo model.
  outerhmm:
    name: Outer-product HMM
    authors: ["Nakamura et al. (2014)"]
    bib: Nakamura2014Outer
    description: >
      Outer-product HMM score follower, factorising the state space over score
      position and tempo.
  arzt:
    name: OLTW (Arzt)
    authors: ["Arzt et al. (2008)"]
    bib: Arzt2008Automatic
    description: >
      On-line time warping over an onset piano roll, aligning event by event.
  dixon:
    name: OLTW (Dixon)
    authors: ["Dixon (2005)"]
    bib: Dixon2005Live
    description: >
      On-line time warping with a forward path constraint, aligning event by
      event.
  pfkorz:
    name: Particle filter (Korzeniowski)
    authors: ["Korzeniowski et al. (2013)"]
    bib: Korzeniowski2013Tracking
    description: >
      The matchmaker team's particle filter, based on Korzeniowski et al.
      (2013) and extended to MIDI input. Tracks score position, note and local
      tempo, and rests, on pitch observations.
    # Given the performance's tempo. Marked on the leaderboard.
    estimated_bpm: true
  SL_OLTW:
    name: Symbolic OLTW (parangonar)
    authors: ["Peter et al. (2025)"]
    bib: Peter2025Pairing
    description: >
      On-line time warping over symbolic note events, from the parangonar
      alignment library (https://github.com/sildater/parangonar). Matches one
      performed note at a time against the score note array.
  SLT_OLTW:
    name: Symbolic tempo OLTW (parangonar)
    authors: ["Peter et al. (2025)"]
    bib: Peter2025Pairing
    description: >
      The tempo-tracking variant of parangonar's symbolic on-line time warping,
      which estimates a local tempo alongside the alignment.
  OTM:
    name: Online transformer matcher (parangonar)
    authors: ["Peter (2023)"]
    bib: Peter2023Online
    description: >
      Transformer-based online note matcher from parangonar, combining a
      learned model with a symbolic alignment stage.
  OPTM:
    name: Online pure transformer matcher (parangonar)
    authors: ["Peter (2023)"]
    bib: Peter2023Online
    description: >
      Transformer-based online note matcher from parangonar, run without the
      additional symbolic alignment stage.

audio:
  arzt:
    name: OLTW (Arzt)
    authors: ["Arzt et al. (2008)"]
    bib: Arzt2008Automatic
    description: >
      On-line time warping against a synthesised rendering of the score, on
      chroma features.
  arzt_tempo:
    name: OLTW (Arzt with Tempo)
    authors: ["Arzt and Widmer (2010)"]
    bib: Arzt2010Simple
    description: >
      On-line time warping against a synthesised rendering of the score that is
      stretched by a tempo estimated from the backward path, on chroma features.
  dixon:
    name: OLTW (Dixon)
    authors: ["Dixon (2005)"]
    bib: Dixon2005Live
    description: >
      On-line time warping with a forward path constraint, on log-spectral
      energy features.
  outerhmm:
    name: Outer-product HMM
    authors: ["Nakamura et al. (2016)"]
    bib: Nakamura2016Real
    description: >
      Outer-product HMM on CQT spectral-flux features.
  skf:
    name: Switching Kalman filter
    authors: ["Jiang and Raphael (2020)"]
    bib: Jiang2020Score
    description: >
      Switching Kalman filter with hidden tempo, on raw spectrum features.
  pfkorz:
    name: Particle filter (Korzeniowski)
    authors: ["Korzeniowski et al. (2013)"]
    bib: Korzeniowski2013Tracking
    description: >
      The matchmaker team's particle filter, based on Korzeniowski et al.
      (2013). Tracks score position, note and local tempo, and rests, on
      spectral-template, onset and loudness features.
    # Given the performance's tempo. Marked on the leaderboard.
    estimated_bpm: true

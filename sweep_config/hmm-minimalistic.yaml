program: matchmaker_eval/test_symbolic.py
command:
  - ${env}
  - python
  - ${program}
  - --sweep
name: hmm
method: grid

metric:
  # The leaderboard's primary metric, and what the audio sweeps use.
  # The old `average.<10ms` came from sweep.py's own summary shape,
  # which no longer exists.
  name: tracking_rate
  goal: maximize

parameters:
  dataset:
    value: "valid"

  method:
    value: "hmm"

  input_type:
    value: "midi"

  processor:
    value: "pitch"

  piano_range:
    values: [True, False]

  tempo_model:
    values: ["KalmanTempoModel", "LinearTempoModel", "MovingAverageTempoModel", "ReactiveTempoModel", "JointAdaptationAnticipationModel"]

  init_beat_period:
    values: [0.5, 0.6]
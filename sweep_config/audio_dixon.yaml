program: matchmaker_eval/test_audio.py
command:
  - ${env}
  - python
  - ${program}
  - --sweep
name: audio-dixon
method: bayes

metric:
  name: tracking_rate
  goal: maximize

parameters:
  dataset:
    value: "valid"

  method:
    value: "dixon"

  feature_type:
    values: ["lse"]

  sample_rate:
    values: [44100, 24000]

  frame_rate:
    value: 30

  window_size:
    values: [10]

  max_run_count:
    value: 3

  distance_func:
    values: ["euclidean"]

# Publish the leaderboard to GitHub Pages.
#
# The site is docs/ plus a copy of results/leaderboard.json, so the page is a
# static read of exactly the file the evaluation workflow committed.
name: Publish leaderboard

on:
  push:
    # `main` only, deliberately. The `submissions` branch evaluates and commits
    # results without publishing them, so a run can be checked or withdrawn
    # before it reaches the site. See the note in evaluate.yml.
    branches: [main]
    paths:
      - "results/leaderboard.json"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        # Same script the staging preview uses, so what a maintainer looked at
        # on the `submissions` branch is assembled exactly like what goes live.
        run: python matchmaker_eval/build_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

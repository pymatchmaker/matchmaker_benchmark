# Publish selected runs as a release and deploy the leaderboard from its snapshot.
name: Publish leaderboard

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      source_runs:
        description: "Completed CI run IDs, separated by spaces; later runs replace entries (empty = republish)"
        required: false
        default: ""
      release_tag:
        description: "New benchmark-* tag when releasing; otherwise existing tag or empty for latest"
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.results.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Keep published results outside the code checkout
        run: echo "MATCHMAKER_RESULTS_DIR=$RUNNER_TEMP/benchmark-published-results" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install result export dependencies
        run: |
          pip install "pymatchmaker @ git+https://github.com/pymatchmaker/matchmaker.git@v0.5.0"
          pip install pyyaml pydantic-settings

      - name: Preserve selected runs or fetch published results
        id: results
        env:
          SOURCE_RUNS: ${{ inputs.source_runs }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python matchmaker_eval/release_results.py --source-runs "$SOURCE_RUNS" --tag "$RELEASE_TAG"

      - name: Assemble the site
        if: steps.results.outputs.ready == 'true'
        run: python matchmaker_eval/build_site.py _site

      - uses: actions/configure-pages@v5
        if: steps.results.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.results.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

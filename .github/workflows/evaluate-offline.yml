name: "Evaluate - Matchmaker (offline)"
on:
  workflow_call:
    inputs:
      shards:
        type: string
        default: '8'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          shards = int(os.environ["SHARDS"])
          jobs = [{"fold": fold, "shard": s} for fold in ["eval", "beyond_piano"] for s in range(shards)]
          print("matrix=" + json.dumps(jobs))
          print(f"shards={shards}")
          PY
  evaluate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MATCHMAKER_DATA_DIR: ${{ github.workspace }}/benchmark-data
      MATCHMAKER_DATA_BRANCH: 03b51262b9bce7993203044fa45c9be9dadebd34
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fixed environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth libsndfile1 ffmpeg
          pip install -r requirements-eval.txt
      - name: Install the offline numerical environment
        run: |
          pip install 'numpy==1.26.4' 'scipy==1.14.1' 'pandas==2.2.3' 'librosa==0.10.2' 'numba==0.64.0' ipython pretty_midi music21
          pip install --no-deps 'synctoolbox==1.3.2' 'libfmp==1.3.0'
      - name: Run offline reference
        run: |
          python matchmaker_eval/run_offline.py --fold '${{ matrix.job.fold }}' \
            --shard '${{ matrix.job.shard }}' --num-shards '${{ needs.plan.outputs.shards }}' \
            --piece-timeout 2400 --output results/offline
      - name: Record installed packages
        if: always()
        run: mkdir -p results/offline && pip freeze > results/offline/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.job.fold }}-${{ matrix.job.shard }}
          path: results/offline
          retention-days: 30
  merge:
    needs: [plan,evaluate]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements-eval.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-*
          path: results/shards
      - name: Merge the shards
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          sys.path.insert(0, 'matchmaker_eval')
          from merge_shards import merge

          output = Path('results/offline-reference')
          output.mkdir(parents=True, exist_ok=True)
          for fold in ['eval', 'beyond_piano']:
              key = 'offline-' + fold
              stage = Path('results/staging') / key
              for i in range(int(os.environ['SHARDS'])):
                  shutil.copytree(Path('results/shards') / f'{key}-{i}', stage / str(i))
              merge(stage, output / key)
          shutil.copytree('results/shards', output / 'raw-shards')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-offline
          path: results/offline-reference
          retention-days: 90

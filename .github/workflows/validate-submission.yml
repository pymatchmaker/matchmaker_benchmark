# Pull-request gate for submissions.
#
# Runs on `pull_request`, deliberately NOT on `pull_request_target`: this job
# executes code from the pull request, so it must never be given the repository
# secrets or a writable token. It runs on an ephemeral runner with a read-only
# token, and it cannot touch the leaderboard.
#
# What this proves: the submission is well-formed and its follower runs. What it
# cannot prove: that the code is safe or that the eval fold was not used for
# tuning. Those are the maintainer's job at review time — see
# docs/eval-protocol.md.
name: Validate submission

on:
  pull_request:
    paths:
      - "submissions/**"
      - "matchmaker_eval/**"
      - "data/folds/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to diff against the base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        # fluidsynth backs matchmaker's score synthesis (audio submissions).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth libsndfile1

      - name: Install the benchmark environment
        # Deliberately not `-r requirements.txt`: that file covers the full
        # benchmark, including madmom (a slow source build), pyaudio and
        # python-rtmidi (live devices, useless on a runner) and wandb. The
        # submission path needs matchmaker plus the two imports in
        # matchmaker_eval/utils.py, and nothing else.
        run: |
          python -m pip install --upgrade pip
          # TEMPORARY pin. matchmaker_eval/methods.py reads the method
          # spec from matchmaker.registry, which is on matchmaker's develop and
          # not yet on matchmaker's main. Revert to @main once merged.
          pip install "pymatchmaker @ git+https://github.com/pymatchmaker/matchmaker.git@develop"
          pip install pyyaml pydantic-settings

      - name: Find the submissions touched by this pull request
        id: changed
        run: |
          dirs=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                 | grep -E '^submissions/[^_][^/]*/' \
                 | cut -d/ -f1,2 | sort -u | tr '\n' ' ')
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          echo "Submissions touched: ${dirs:-none}"

      - name: A pull request into `submissions` may touch only one submission
        # Contributor submissions target `submissions` (see docs/submitting.md),
        # never `main` directly, so this is the gate that keeps a contributor's
        # pull request confined to their own submissions/<name>/ directory --
        # no pipeline changes, no workflow changes, no other submitter's
        # directory. Benchmark changes are a maintainer's pull request into
        # `main`, which this check does not apply to.
        if: github.base_ref == 'submissions'
        run: |
          other=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                  | grep -vE '^submissions/[^_][^/]*/' | head -n1)
          if [ -n "$other" ]; then
            echo "::error::Pull requests into submissions may only add or change files inside one submissions/<name>/ directory. This one also touches '${other}' -- benchmark, workflow or docs changes belong in a pull request into main."
            exit 1
          fi
          count=$(echo "${{ steps.changed.outputs.dirs }}" | wc -w)
          if [ "$count" -eq 0 ]; then
            echo "::error::This pull request does not add or change a submissions/<name>/ directory."
            exit 1
          elif [ "$count" -gt 1 ]; then
            echo "::error::This pull request touches $count submissions. Please open one pull request per submission."
            exit 1
          fi

      - name: Install the submission's dependencies
        if: steps.changed.outputs.dirs != ''
        run: |
          for dir in ${{ steps.changed.outputs.dirs }}; do
            if [ -s "$dir/requirements.txt" ]; then
              echo "::group::pip install -r $dir/requirements.txt"
              pip install -r "$dir/requirements.txt"
              echo "::endgroup::"
            fi
          done

      - name: Validate and smoke-test
        # The example fold is the single piece committed under resources/, so
        # this needs no dataset download.
        if: steps.changed.outputs.dirs != ''
        run: |
          python matchmaker_eval/validate_submission.py ${{ steps.changed.outputs.dirs }} --smoke

      - name: Check the fold definitions are intact
        run: python matchmaker_eval/make_folds.py --check

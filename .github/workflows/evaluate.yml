# Full evaluation, after merge — on GitHub's own runners.
#
# Contributors download nothing. The data lives in its own public repository,
# pymatchmaker/matchmaker-benchmark-data, laid out exactly as the benchmark
# expects — so a checkout of it *is* MATCHMAKER_DATA_DIR and no file is
# downloaded piece by piece. Which repository and branch a fold reads is
# data/data_sources.yaml; the plan job reads it there so the address is written
# down once (`fetch_data.py --source`).
#
# This workflow splits the fold across parallel jobs; each job checks out the
# data, runs its shard of the submission and uploads its results. A final job
# merges the shards, rebuilds the leaderboard and commits it.
#
# The checkout is the fast path, not the only one: if it does not carry
# everything the fold names, fetch_data.py fills the gap file by file and the
# shard refuses to start until a second check passes.
#
# This is the only workflow that writes to the repository, and it runs only on
# the branches listed below — on code a maintainer has already reviewed and
# merged.
#
# Two branches, on purpose:
#
#   submissions  a staging branch. Evaluation runs and results/ is committed
#                here, but `pages.yml` does not publish from it — so a run can
#                be inspected, rerun or withdrawn before anyone sees it.
#   main         merging `submissions` into it publishes the leaderboard.
#
# So the safe order is: merge a submission into `submissions`, let this workflow
# evaluate it, check results/leaderboard.json, and only then merge to `main`.
# To withdraw a result after the fact, see matchmaker_eval/retract.py.
#
# Sharding is what makes this fit: a job on a GitHub runner is capped at 6
# hours, and audio evaluation over 146 pieces does not fit in one. Shards are
# round-robin, so the merged numbers are identical to an unsharded run.
#
# It also works unchanged on a self-hosted runner that already holds the data:
# set the repository variable MATCHMAKER_DATA_DIR to that copy and the checkout
# is skipped. Set BENCHMARK_RUNNER to the runner's label.
name: Evaluate submissions

on:
  push:
    # `branches:` cannot take a variable, so staging branches are listed here.
    branches: [main, submissions]
    paths:
      - "submissions/**"
      - "matchmaker_eval/**"
      - "data/**"
      - ".github/workflows/evaluate.yml"
  workflow_dispatch:
    inputs:
      submission:
        description: "Target method or submission directory (empty = evaluate all manuscript models)"
        required: false
        default: ""
      fold:
        description: "Fold to evaluate on"
        required: false
        default: eval
      shards:
        description: "How many parallel shards"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  # One evaluation at a time: two would race on results/leaderboard.json.
  group: evaluate
  cancel-in-progress: false

env:
  FOLD: ${{ github.event.inputs.fold || 'eval' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      shards: ${{ steps.plan.outputs.shards }}
      num_shards: ${{ steps.plan.outputs.num_shards }}
      data_repo: ${{ steps.source.outputs.data_repo }}
      data_branch: ${{ steps.source.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what to evaluate
        id: plan
        run: |
          pip install --quiet pyyaml
          python -c "
          import json, os

          sub = '${{ github.event.inputs.submission }}'
          if sub == 'all':
              targets = [
                  {'id': 'arzt-audio', 'type': 'method', 'target': 'arzt', 'input_type': 'audio'},
                  {'id': 'arzt_tempo-audio', 'type': 'method', 'target': 'arzt_tempo', 'input_type': 'audio'},
                  {'id': 'skf-audio', 'type': 'method', 'target': 'skf', 'input_type': 'audio'},
                  {'id': 'dixon-audio', 'type': 'method', 'target': 'dixon', 'input_type': 'audio'},
                  {'id': 'outerhmm-audio', 'type': 'method', 'target': 'outerhmm', 'input_type': 'audio'},
              ]
          elif sub:
              if os.path.isdir(sub):
                  targets = [{'id': os.path.basename(sub.rstrip('/')), 'type': 'submission', 'target': sub, 'input_type': 'audio'}]
              else:
                  targets = [{'id': f'{sub}-audio', 'type': 'method', 'target': sub, 'input_type': 'audio'}]
          else:
              targets = []

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'targets={json.dumps(targets)}\n')
          print(f'Configured {len(targets)} target(s) for evaluation.')
          "
          n="${{ github.event.inputs.shards || '4' }}"
          echo "num_shards=${n}" >> "$GITHUB_OUTPUT"
          echo "shards=$(python -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$n")" >> "$GITHUB_OUTPUT"
          echo "Evaluating on ${FOLD} in $n shards"

      - name: Locate this fold's data
        id: source
        # data/data_sources.yaml maps a fold to a branch of the data
        # repository. Reading it here means the address is not repeated in this
        # file, so moving or renaming the data repository stays a one-line edit.
        run: |
          eval "$(python matchmaker_eval/fetch_data.py --source --fold "$FOLD")"
          echo "data_repo=${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Fold ${FOLD} reads ${owner}/${repo}@${branch}"

  evaluate:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false  # one bad shard should not discard the rest
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth libsndfile1 ffmpeg

      - name: Install the benchmark environment
        run: |
          python -m pip install --upgrade pip
          # TEMPORARY: pinned to matchmaker's imm_graph branch (the paper's final model) until it is merged into main.
          pip install "pymatchmaker @ git+https://github.com/laurenceyoon/matchmaker.git@imm_graph"
          pip install pyyaml pydantic-settings
          if [ "${{ matrix.target.type }}" = "submission" ] && [ -s "${{ matrix.target.target }}/requirements.txt" ]; then
            pip install --force-reinstall --no-deps -r "${{ matrix.target.target }}/requirements.txt"
          fi

      - name: Check out the benchmark data
        if: vars.MATCHMAKER_DATA_DIR == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.data_repo }}
          ref: ${{ needs.plan.outputs.data_branch }}
          token: ${{ secrets.MATCHMAKER_DATA_TOKEN || github.token }}
          path: benchmark-data
          persist-credentials: false

      - name: Point the benchmark at the data
        run: |
          if [ -n "${{ vars.MATCHMAKER_DATA_DIR }}" ]; then
            echo "MATCHMAKER_DATA_DIR=${{ vars.MATCHMAKER_DATA_DIR }}" >> "$GITHUB_ENV"
          else
            echo "MATCHMAKER_DATA_DIR=${{ github.workspace }}/benchmark-data" >> "$GITHUB_ENV"
          fi

      - name: Check this shard's files are all present
        id: verify
        continue-on-error: true
        run: |
          python matchmaker_eval/fetch_data.py --verify \
            --fold "$FOLD" \
            --input-type "${{ matrix.target.input_type }}" \
            --shard ${{ matrix.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Fetch anything the checkout did not provide
        if: steps.verify.outcome == 'failure'
        env:
          MATCHMAKER_DATA_TOKEN: ${{ secrets.MATCHMAKER_DATA_TOKEN }}
        run: |
          echo "::notice::the checkout was incomplete; fetching the rest"
          python matchmaker_eval/fetch_data.py \
            --fold "$FOLD" \
            --input-type "${{ matrix.target.input_type }}" \
            --shard ${{ matrix.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Confirm the data is complete
        if: steps.verify.outcome == 'failure'
        run: |
          python matchmaker_eval/fetch_data.py --verify \
            --fold "$FOLD" \
            --input-type "${{ matrix.target.input_type }}" \
            --shard ${{ matrix.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Run the shard
        run: |
          if [ "${{ matrix.target.type }}" = "submission" ]; then
            python matchmaker_eval/run_submission.py \
              "${{ matrix.target.target }}" \
              --fold "$FOLD" \
              --shard ${{ matrix.shard }} \
              --num-shards ${{ needs.plan.outputs.num_shards }} \
              --output "results/shards/${{ matrix.target.id }}/shard-${{ matrix.shard }}"
          else
            python matchmaker_eval/run_submission.py \
              --method "${{ matrix.target.target }}" \
              --input-type "${{ matrix.target.input_type }}" \
              --fold "$FOLD" \
              --shard ${{ matrix.shard }} \
              --num-shards ${{ needs.plan.outputs.num_shards }} \
              --output "results/shards/${{ matrix.target.id }}/shard-${{ matrix.shard }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.id }}-shard-${{ matrix.shard }}
          path: results/shards/${{ matrix.target.id }}/shard-${{ matrix.shard }}
          retention-days: 30

  merge:
    needs: [plan, evaluate]
    if: always() && needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the merge needs
        run: |
          python -m pip install --upgrade pip
          # TEMPORARY: pinned to matchmaker's imm_graph branch (the paper's final model) until it is merged into main.
          pip install --quiet "pymatchmaker @ git+https://github.com/laurenceyoon/matchmaker.git@imm_graph"
          pip install --quiet pyyaml pydantic-settings

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-shard-*"
          path: results/downloaded_shards

      - name: Reorganize and merge all targets
        run: |
          python -c "
          import os, shutil
          from pathlib import Path

          dl_root = Path('results/downloaded_shards')
          shards_root = Path('results/shards')
          shards_root.mkdir(parents=True, exist_ok=True)

          for art_dir in dl_root.glob('*-shard-*'):
              if not art_dir.is_dir():
                  continue
              name = art_dir.name
              idx = name.rfind('-shard-')
              if idx == -1:
                  continue
              target_id = name[:idx]
              shard_id = name[idx+1:]
              dest = shards_root / target_id / shard_id
              dest.mkdir(parents=True, exist_ok=True)
              for f in art_dir.iterdir():
                  if f.is_file():
                      shutil.copy2(f, dest / f.name)

          print('Reorganized targets:', [p.name for p in shards_root.iterdir() if p.is_dir()])
          "

          for target_dir in results/shards/*; do
            if [ -d "$target_dir" ]; then
              echo "::group::Merging $target_dir"
              python matchmaker_eval/merge_shards.py "$target_dir"
              echo "::endgroup::"
            fi
          done

      - name: Clean up temporary shard artifacts before committing
        run: |
          rm -rf results/downloaded_shards results/shards

      - name: Export the per-piece detail
        run: python matchmaker_eval/export_details.py

      - name: Rebuild the leaderboard
        run: python matchmaker_eval/leaderboard.py

      - name: Assemble the site for review
        run: python matchmaker_eval/build_site.py _site

      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard-site
          path: _site
          retention-days: 14

      - name: Commit the results
        run: |
          git config user.name "matchmaker-benchmark[bot]"
          git config user.email "actions@github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "Leaderboard unchanged."
            exit 0
          fi
          git commit -m "benchmark: evaluate all manuscript models on the ${{ env.FOLD }} fold

          Run ${{ github.run_id }}."
          git pull --rebase --autostash
          git push

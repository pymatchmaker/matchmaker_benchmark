# Full evaluation, after merge — on GitHub's own runners.
#
# Contributors download nothing. The data lives in its own public repository,
# pymatchmaker/matchmaker-benchmark-data, laid out exactly as the benchmark
# expects — so a checkout of it *is* MATCHMAKER_DATA_DIR and no file is
# downloaded piece by piece. Which repository and branch a fold reads is
# data/data_sources.yaml; the plan job reads it there so the address is written
# down once (`fetch_data.py --source`).
#
# A maintainer explicitly selects a reviewed submission or built-in method.
# Results are uploaded as artifacts and never committed to the code branch.
# After the code is on main, evaluate that main commit and select the
# completed run in Publish leaderboard to preserve and publish a release.
#
# Sharding is what makes this fit: a job on a GitHub runner is capped at 6
# hours, and audio evaluation over 146 pieces does not fit in one. Shards are
# round-robin, so the merged numbers are identical to an unsharded run.
#
# It also works unchanged on a self-hosted runner that already holds the data:
# set the repository variable MATCHMAKER_DATA_DIR to that copy and the checkout
# is skipped. Set BENCHMARK_RUNNER to the runner's label.
name: Evaluate submissions

on:
  workflow_dispatch:
    inputs:
      submission:
        description: "Submission directory (leave empty only when specifying method)"
        required: false
        default: ""
      method:
        description: "Built-in method to evaluate as a reference, e.g. arzt (leave submission empty)"
        required: false
        default: ""
      input_type:
        description: "Stream for --method: audio or midi"
        required: false
        default: midi
        type: choice
        options: [midi, audio]
      fold:
        description: "Fold to evaluate on"
        required: false
        default: eval
      shards:
        description: "How many parallel shards"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  # Share the references workflow's lock for the same branch and fold.
  group: evaluate-${{ github.ref }}-${{ github.event.inputs.fold || 'eval' }}
  cancel-in-progress: false

env:
  FOLD: ${{ github.event.inputs.fold || 'eval' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      count: ${{ steps.plan.outputs.count }}
      entries: ${{ steps.plan.outputs.entries }}
      num_shards: ${{ steps.plan.outputs.num_shards }}
      data_repo: ${{ steps.source.outputs.data_repo }}
      data_branch: ${{ steps.source.outputs.branch }}
      results_root: ${{ steps.plan.outputs.results_root }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what to evaluate
        id: plan
        # Full evaluations are explicit, so a merge cannot start a duplicate run.
        run: |
          pip install --quiet pyyaml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          import yaml

          n = int(os.environ["SHARDS"])
          method = os.environ.get("METHOD") or ""
          submission = os.environ.get("SUBMISSION") or ""

          if not 1 <= n <= 32:
              raise SystemExit("shards must be between 1 and 32")
          if bool(method) == bool(submission):
              raise SystemExit("Specify one submission directory or method, not both")

          entries = []
          jobs = []
          if method:
              input_type = os.environ["INPUT_TYPE"]
              entry = f"{method}-{input_type}"
              entries.append(entry)
              jobs += [
                  {
                      "target": f"--method {method} --input-type {input_type}",
                      "entry": entry,
                      "input_type": input_type,
                      "shard": s,
                  }
                  for s in range(n)
              ]
          else:
              input_type = yaml.safe_load(open(f"{submission}/metadata.yaml"))["input_type"]
              entry = submission.rstrip("/").split("/")[-1]
              entries.append(entry)
              jobs += [
                  {"target": submission, "entry": entry, "input_type": input_type, "shard": s}
                  for s in range(n)
              ]

          print(f"jobs={json.dumps(jobs)}")
          print(f"count={len(jobs)}")
          print(f"entries={' '.join(entries) or 'none'}")
          print(f"num_shards={n}")
          fold = os.environ["FOLD"]
          output = f"results/ci/{fold}"
          print(f"results_root={output}")
          PY
        env:
          METHOD: ${{ github.event.inputs.method }}
          SUBMISSION: ${{ github.event.inputs.submission }}
          INPUT_TYPE: ${{ github.event.inputs.input_type || 'midi' }}
          SHARDS: ${{ github.event.inputs.shards || '8' }}

      - name: Locate this fold's data
        id: source
        # data/data_sources.yaml maps a fold to a branch of the data
        # repository. Reading it here means the address is not repeated in this
        # file, so moving or renaming the data repository stays a one-line edit.
        run: |
          eval "$(python matchmaker_eval/fetch_data.py --source --fold "$FOLD")"
          echo "data_repo=${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Fold ${FOLD} reads ${owner}/${repo}@${branch}"

  evaluate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false  # one bad shard, or one bad submission, should not discard the rest
      max-parallel: 12
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth libsndfile1 ffmpeg

      - name: Install the benchmark environment
        run: |
          python -m pip install --upgrade pip
          # The shared installer fixes the library sources for every job.
          python .github/install_matchmaker.py
          pip install pyyaml pydantic-settings
          if [ -d "${{ matrix.job.target }}" ] && [ -s "${{ matrix.job.target }}/requirements.txt" ]; then
            pip install -r "${{ matrix.job.target }}/requirements.txt"
          fi

      - name: Check out the benchmark data
        # The data repository's layout is the one MATCHMAKER_DATA_DIR expects,
        # so this checkout is the whole data step: one shallow clone of the
        # branch this fold reads, and nothing fetched file by file.
        #
        # MATCHMAKER_DATA_TOKEN is only needed while the data repository is
        # private. Add it as a repository secret with read access to that repo;
        # once the repository is public, delete the secret and this keeps
        # working. Skipped entirely when MATCHMAKER_DATA_DIR is set to a copy
        # the runner already holds.
        if: vars.MATCHMAKER_DATA_DIR == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.data_repo }}
          ref: ${{ needs.plan.outputs.data_branch }}
          token: ${{ secrets.MATCHMAKER_DATA_TOKEN || github.token }}
          path: benchmark-data
          persist-credentials: false

      - name: Point the benchmark at the data
        run: |
          if [ -n "${{ vars.MATCHMAKER_DATA_DIR }}" ]; then
            echo "MATCHMAKER_DATA_DIR=${{ vars.MATCHMAKER_DATA_DIR }}" >> "$GITHUB_ENV"
          else
            echo "MATCHMAKER_DATA_DIR=${{ github.workspace }}/benchmark-data" >> "$GITHUB_ENV"
          fi

      - name: Check this shard's files are all present
        # Names anything the fold asks for that the checkout did not provide,
        # before spending an hour discovering it piece by piece. Allowed to
        # fail so the fetch below can fill the gap.
        id: verify
        continue-on-error: true
        run: |
          python matchmaker_eval/fetch_data.py --verify \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Fetch anything the checkout did not provide
        # The checkout is the fast path, not the only one. A fold whose data is
        # not all in that branch — or a dataset served from somewhere else via
        # `url_template` — is downloaded file by file into the same directory.
        if: steps.verify.outcome == 'failure'
        env:
          MATCHMAKER_DATA_TOKEN: ${{ secrets.MATCHMAKER_DATA_TOKEN }}
        run: |
          echo "::notice::the checkout was incomplete; fetching the rest"
          python matchmaker_eval/fetch_data.py \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Confirm the data is complete
        # The hard gate: whichever route got the files here, the shard does not
        # start until everything the fold names is on disk.
        if: steps.verify.outcome == 'failure'
        run: |
          python matchmaker_eval/fetch_data.py --verify \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Run the shard
        # `target` is either a submission directory or `--method X --input-type Y`
        # for a built-in reference, so it is deliberately unquoted.
        #
        # One BLAS thread, matching evaluate-references.yml: a runner's core
        # count would otherwise move the timing columns between one entry and
        # the next, and those columns are compared across entries.
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python matchmaker_eval/run_submission.py \
            ${{ matrix.job.target }} \
            --fold "$FOLD" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }} \
            --output "results/shards/current"

      - uses: actions/upload-artifact@v4
        with:
          name: refshard-${{ matrix.job.entry }}-${{ matrix.job.shard }}
          path: results/shards/current
          retention-days: 30

  merge:
    needs: [plan, evaluate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep preview files outside the code checkout
        run: echo "MATCHMAKER_RESULTS_DIR=$RUNNER_TEMP/benchmark-preview" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the merge needs
        # Merging only recomputes the pooled summary from the shards' alignment
        # paths, so it needs numpy and the eval helpers, not matchmaker itself.
        run: |
          python .github/install_matchmaker.py
          pip install --quiet pyyaml pydantic-settings

      - uses: actions/download-artifact@v4
        with:
          pattern: refshard-*
          path: results/refshards

      - name: Merge each submission
        # One run can bring shards for several new or changed submissions;
        # this regroups them by entry (see refshard-<entry>-<shard> above) and
        # merges each separately. An entry missing shards stays partial and
        # off the leaderboard rather than being merged into a bad record.
        run: python matchmaker_eval/merge_references.py results/refshards --fold "$FOLD" --output "${{ needs.plan.outputs.results_root }}"

      - name: Upload the complete merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ env.FOLD }}
          path: ${{ needs.plan.outputs.results_root }}
          if-no-files-found: error
          retention-days: 30

      - name: Stage the piano results for the leaderboard
        if: env.FOLD == 'eval'
        run: |
          mkdir -p "$MATCHMAKER_RESULTS_DIR/submissions"
          cp -a "${{ needs.plan.outputs.results_root }}/." "$MATCHMAKER_RESULTS_DIR/submissions/"

      - name: Export the per-piece detail
        if: env.FOLD == 'eval'
        # Dataset breakdowns, per-piece rows and the decimated alignment paths
        # the leaderboard page plots. Written per entry and loaded on demand.
        run: python matchmaker_eval/export_details.py

      - name: Rebuild the leaderboard
        if: env.FOLD == 'eval'
        run: python matchmaker_eval/leaderboard.py

      - name: Assemble the site for review
        if: env.FOLD == 'eval'
        # Preview only this run; it does not alter the public leaderboard.
        run: python matchmaker_eval/build_site.py _site

      - uses: actions/upload-artifact@v4
        if: env.FOLD == 'eval'
        with:
          name: leaderboard-site
          path: _site
          retention-days: 14

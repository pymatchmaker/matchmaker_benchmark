# Evaluate new or changed submissions after they merge into `submissions`.
name: "Evaluate - Submission"

on:
  push:
    branches: [submissions]
    paths:
      - "submissions/**"
  workflow_dispatch:
    inputs:
      submission:
        description: "Submission directory (empty = whatever this push changed)"
        required: false
        default: ""
      method:
        description: "Built-in method to evaluate as a reference, e.g. arzt (leave submission empty)"
        required: false
        default: ""
      input_type:
        description: "Stream for --method: audio or midi"
        required: false
        default: midi
        type: choice
        options: [midi, audio]
      fold:
        description: "Fold to evaluate on"
        required: false
        default: eval
      shards:
        description: "How many parallel shards"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  # One evaluation at a time, shared with evaluate-references.yml.
  group: evaluate
  cancel-in-progress: false

env:
  FOLD: ${{ github.event.inputs.fold || 'eval' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      count: ${{ steps.plan.outputs.count }}
      entries: ${{ steps.plan.outputs.entries }}
      num_shards: ${{ steps.plan.outputs.num_shards }}
      data_repo: ${{ steps.source.outputs.data_repo }}
      data_branch: ${{ steps.source.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what to evaluate
        id: plan
        run: |
          pip install --quiet pyyaml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess

          import yaml

          n = int(os.environ["SHARDS"])
          method = os.environ.get("METHOD") or ""
          submission = os.environ.get("SUBMISSION") or ""

          def changed_submissions(before, after):
              if not before or before == "0" * 40:
                  return []
              diff = subprocess.run(
                  ["git", "diff", "--name-only", before, after],
                  capture_output=True, text=True, check=True,
              ).stdout
              found = set()
              for line in diff.splitlines():
                  parts = line.split("/")
                  if len(parts) >= 3 and parts[0] == "submissions" and not parts[1].startswith("_"):
                      found.add(f"submissions/{parts[1]}")
              return sorted(found)

          entries = []
          jobs = []
          if method:
              input_type = os.environ["INPUT_TYPE"]
              entry = f"{method}-{input_type}"
              entries.append(entry)
              jobs += [
                  {
                      "target": f"--method {method} --input-type {input_type}",
                      "entry": entry,
                      "input_type": input_type,
                      "shard": s,
                  }
                  for s in range(n)
              ]
          else:
              if submission:
                  dirs = [submission]
              elif os.environ["EVENT_NAME"] == "push":
                  dirs = changed_submissions(os.environ.get("BEFORE"), os.environ.get("AFTER"))
              else:
                  dirs = []
              for d in dirs:
                  metadata_path = f"{d}/metadata.yaml"
                  if not os.path.exists(metadata_path):
                      print(f"{d} no longer exists, skipping")
                      continue
                  input_type = yaml.safe_load(open(metadata_path))["input_type"]
                  entry = d.split("/")[-1]
                  entries.append(entry)
                  jobs += [
                      {"target": d, "entry": entry, "input_type": input_type, "shard": s}
                      for s in range(n)
                  ]

          print(f"jobs={json.dumps(jobs)}")
          print(f"count={len(jobs)}")
          print(f"entries={' '.join(entries) or 'none'}")
          print(f"num_shards={n}")
          PY
        env:
          METHOD: ${{ github.event.inputs.method }}
          SUBMISSION: ${{ github.event.inputs.submission }}
          INPUT_TYPE: ${{ github.event.inputs.input_type || 'midi' }}
          SHARDS: ${{ github.event.inputs.shards || '8' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}

      - name: Locate this fold's data
        id: source
        run: |
          eval "$(python matchmaker_eval/fetch_data.py --source --fold "$FOLD")"
          echo "data_repo=${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Fold ${FOLD} reads ${owner}/${repo}@${branch}"

  evaluate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    # On a self-hosted runner, set BENCHMARK_RUNNER to its label and MATCHMAKER_DATA_DIR to its data copy.
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false  # one bad shard, or one bad submission, should not discard the rest
      max-parallel: 12
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth libsndfile1 ffmpeg

      - name: Install the benchmark environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-eval.txt
          if [ -d "${{ matrix.job.target }}" ] && [ -s "${{ matrix.job.target }}/requirements.txt" ]; then
            pip install -r "${{ matrix.job.target }}/requirements.txt"
          fi

      - name: Check out the benchmark data
        # MATCHMAKER_DATA_TOKEN grants read access to the data repository if it is private.
        if: vars.MATCHMAKER_DATA_DIR == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.data_repo }}
          ref: ${{ needs.plan.outputs.data_branch }}
          token: ${{ secrets.MATCHMAKER_DATA_TOKEN || github.token }}
          path: benchmark-data
          persist-credentials: false

      - name: Point the benchmark at the data
        run: |
          if [ -n "${{ vars.MATCHMAKER_DATA_DIR }}" ]; then
            echo "MATCHMAKER_DATA_DIR=${{ vars.MATCHMAKER_DATA_DIR }}" >> "$GITHUB_ENV"
          else
            echo "MATCHMAKER_DATA_DIR=${{ github.workspace }}/benchmark-data" >> "$GITHUB_ENV"
          fi

      - name: Check this shard's files are all present
        id: verify
        continue-on-error: true
        run: |
          python matchmaker_eval/fetch_data.py --verify \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Fetch anything the checkout did not provide
        if: steps.verify.outcome == 'failure'
        env:
          MATCHMAKER_DATA_TOKEN: ${{ secrets.MATCHMAKER_DATA_TOKEN }}
        run: |
          echo "::notice::the checkout was incomplete; fetching the rest"
          python matchmaker_eval/fetch_data.py \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Confirm the data is complete
        if: steps.verify.outcome == 'failure'
        run: |
          python matchmaker_eval/fetch_data.py --verify \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Run the shard
        # `target` may hold several arguments, so it is unquoted.
        # One BLAS thread keeps the timing columns comparable across runners.
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python matchmaker_eval/run_submission.py \
            ${{ matrix.job.target }} \
            --fold "$FOLD" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }} \
            --output "results/shards/current"

      - uses: actions/upload-artifact@v4
        with:
          name: refshard-${{ matrix.job.entry }}-${{ matrix.job.shard }}
          path: results/shards/current
          retention-days: 30

  merge:
    needs: [plan, evaluate]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the merge needs
        run: |
          pip install --quiet -r requirements-eval.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: refshard-*
          path: results/refshards

      - name: Merge each submission
        run: python matchmaker_eval/merge_references.py results/refshards --output "results/ci/$FOLD"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ env.FOLD }}
          path: results/ci/${{ env.FOLD }}
          retention-days: 30

      - name: Stage the results for the preview
        run: cp -a "results/ci/$FOLD/." results/submissions/

      - name: Export the per-piece detail
        run: python matchmaker_eval/export_details.py

      - name: Rebuild the leaderboard
        run: python matchmaker_eval/leaderboard.py

      - name: Assemble the site for review
        run: python matchmaker_eval/build_site.py _site

      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard-site
          path: _site
          retention-days: 14

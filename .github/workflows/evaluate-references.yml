# Evaluate matchmaker's built-in methods on GitHub's runners.
#
# The reference rows are what a submission is trying to beat, so they have to be
# measured the way submissions are measured. Until this workflow existed they
# were produced by run_references.py on whoever's laptop was free, which made
# them a different kind of measurement from the rows they are compared against:
# different CPU, different thread count, different corpus on disk.
#
# Everything here mirrors evaluate.yml - the same data checkout, the same
# eight-way round-robin sharding, the same merge and the same leaderboard
# rebuild. The only difference is that it fans out over every described method
# instead of one submission.
#
# Which methods run comes from data/builtin_methods.yaml: a method matchmaker
# has but nobody has described yet is not a leaderboard row, so it is not run.
#
#   Actions -> Evaluate references -> Run workflow
#     input_type: both      shards: 8
#
# Every described entry runs as one job per shard. They queue against the account's
# concurrency limit rather than all starting at once, so expect this to take a
# while; that is the price of every row being measured the same way.
name: Evaluate references

on:
  workflow_dispatch:
    inputs:
      input_type:
        description: "Which references to run"
        required: false
        default: both
        type: choice
        options: [both, midi, audio]
      only:
        description: "Space-separated method names (empty = all described)"
        required: false
        default: ""
      fold:
        description: "Fold: eval, beyond_piano, diagnostics, offline, or amt_reference"
        required: false
        default: eval
      shards:
        description: "How many shards per method"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  # Avoid overlapping evaluations of the same branch and fold.
  group: evaluate-${{ github.ref }}-${{ github.event.inputs.fold || 'eval' }}
  cancel-in-progress: false

env:
  FOLD: ${{ github.event.inputs.fold || 'eval' }}

jobs:
  ophmm_playthrough:
    name: ophmm comparison / evaluate (${{ matrix.condition }}, ${{ matrix.shard }})
    if: github.event.inputs.fold == 'ophmm_playthrough'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        condition: ['on', 'off']
        shard: [0, 1, 2, 3]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth libsndfile1
          python .github/install_matchmaker.py
          pip install pyyaml pydantic-settings
      - name: Evaluate frozen piano fold
        run: |
          python matchmaker_eval/run_submission.py --method outerhmm --input-type midi --fold eval \
            --global-transition '${{ matrix.condition }}' \
            --shard '${{ matrix.shard }}' --num-shards 4 --output results/run
          pip freeze > results/run/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ophmm-${{ matrix.condition }}-${{ matrix.shard }}
          path: results/run
          retention-days: 90
  merge_ophmm_playthrough:
    name: ophmm comparison / merge
    needs: ophmm_playthrough
    if: always() && needs.ophmm_playthrough.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python .github/install_matchmaker.py
          pip install pyyaml pydantic-settings
      - uses: actions/download-artifact@v4
        with:
          pattern: ophmm-*
          path: results/shards
      - name: Merge both conditions and check coverage
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          from matchmaker_eval.merge_shards import merge
          out=Path('results/comparison')
          for condition in ('on','off'):
              staging=Path('results/staging')/condition
              for shard in range(4):
                  src=Path('results/shards')/f'ophmm-{condition}-{shard}'
                  meta=json.loads((src/'metrics.json').read_text())
                  assert meta['metadata']['global_transition']==condition
                  if condition=='off': assert all(x['global_transition_nonzero']==0 for x in meta['pieces'])
                  shutil.copytree(src,staging/str(shard))
              result=merge(staging,out/condition)
              assert not result['partial'] and result['n_failed']==0 and result['n_pieces']==146
          shutil.copytree('results/shards',out/'raw-shards')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ophmm-playthrough-comparison
          path: results/comparison
          retention-days: 90

  amt_reference:
    name: amt replay
    if: github.event.inputs.fold == 'amt_reference'
    uses: ./.github/workflows/evaluate-amt.yml
    with:
      shards: ${{ github.event.inputs.shards || '4' }}

  offline:
    if: github.event.inputs.fold == 'offline'
    uses: ./.github/workflows/evaluate-offline.yml
    with:
      shards: ${{ github.event.inputs.shards || '8' }}

  diagnostics:
    if: github.event.inputs.fold == 'diagnostics'
    uses: ./.github/workflows/evaluate-diagnostics.yml
    with:
      shards: ${{ github.event.inputs.shards || '4' }}
      only: ${{ github.event.inputs.only || '' }}
      input_type: ${{ github.event.inputs.input_type || 'both' }}

  plan:
    name: main / plan
    if: github.event.inputs.fold != 'diagnostics' && github.event.inputs.fold != 'offline' && github.event.inputs.fold != 'amt_reference' && github.event.inputs.fold != 'ophmm_playthrough'
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      count: ${{ steps.plan.outputs.count }}
      entries: ${{ steps.plan.outputs.entries }}
      data_repo: ${{ steps.source.outputs.data_repo }}
      data_branch: ${{ steps.source.outputs.branch }}
      num_shards: ${{ steps.plan.outputs.num_shards }}
      results_root: ${{ steps.plan.outputs.results_root }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out which references to run
        id: plan
        run: |
          pip install --quiet pyyaml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          from matchmaker_eval.load_folds import load_fold
          described = yaml.safe_load(
              open("data/builtin_methods.yaml").read()
          ) or {}
          wanted = os.environ["INPUT_TYPE"]
          types = ("midi", "audio") if wanted == "both" else (wanted,)
          only = [m for m in os.environ["ONLY"].split() if m]
          n = int(os.environ["SHARDS"])
          if not 1 <= n <= 32:
              raise SystemExit("shards must be between 1 and 32")
          fold = os.environ["FOLD"]
          pieces = load_fold(fold)
          available = {t for t in ("midi", "audio") if any(p.has_performance(t) for p in pieces)}
          if wanted != "both" and wanted not in available:
              raise SystemExit(f"Fold {fold!r} has no {wanted} performances")
          types = tuple(t for t in types if t in available)

          jobs = [
              {"method": method, "input_type": t, "shard": s}
              for t in types
              for method in sorted(described.get(t) or {})
              if not only or method in only
              for s in range(n)
          ]
          print(f"jobs={json.dumps(jobs)}")
          print(f"count={len(jobs)}")
          entries = sorted({j["method"] + "-" + j["input_type"] for j in jobs})
          print(f"entries={json.dumps(entries)}")
          print(f"num_shards={n}")
          output = f"results/ci/{fold}"
          print(f"results_root={output}")
          PY
        env:
          INPUT_TYPE: ${{ github.event.inputs.input_type || 'both' }}
          ONLY: ${{ github.event.inputs.only }}
          SHARDS: ${{ github.event.inputs.shards || '8' }}

      - name: Locate this fold's data
        id: source
        run: |
          eval "$(python matchmaker_eval/fetch_data.py --source --fold "$FOLD")"
          echo "data_repo=${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Fold ${FOLD} reads ${owner}/${repo}@${branch}"

      - name: Report the plan
        run: |
          echo "${{ steps.plan.outputs.count }} shard job(s) to run"

  evaluate:
    name: main / evaluate (${{ matrix.job.method }}, ${{ matrix.job.input_type }}, ${{ matrix.job.shard }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false  # one bad method should not discard the others
      max-parallel: 12
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth libsndfile1 ffmpeg

      - name: Install the benchmark environment
        run: |
          python -m pip install --upgrade pip
          # The shared installer fixes the library sources for every job.
          python .github/install_matchmaker.py
          pip install pyyaml pydantic-settings

      - name: Check out the benchmark data
        if: vars.MATCHMAKER_DATA_DIR == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.data_repo }}
          ref: ${{ needs.plan.outputs.data_branch }}
          token: ${{ secrets.MATCHMAKER_DATA_TOKEN || github.token }}
          path: benchmark-data
          persist-credentials: false

      - name: Point the benchmark at the data
        run: |
          if [ -n "${{ vars.MATCHMAKER_DATA_DIR }}" ]; then
            echo "MATCHMAKER_DATA_DIR=${{ vars.MATCHMAKER_DATA_DIR }}" >> "$GITHUB_ENV"
          else
            echo "MATCHMAKER_DATA_DIR=${{ github.workspace }}/benchmark-data" >> "$GITHUB_ENV"
          fi

      - name: Check this shard's files are all present
        id: verify
        continue-on-error: true
        run: |
          python matchmaker_eval/fetch_data.py --verify \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Fetch anything the checkout did not provide
        if: steps.verify.outcome == 'failure'
        env:
          MATCHMAKER_DATA_TOKEN: ${{ secrets.MATCHMAKER_DATA_TOKEN }}
        run: |
          echo "::notice::the checkout was incomplete; fetching the rest"
          python matchmaker_eval/fetch_data.py \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Confirm the data is complete
        if: steps.verify.outcome == 'failure'
        run: |
          python matchmaker_eval/fetch_data.py --verify \
            --fold "$FOLD" \
            --input-type "${{ matrix.job.input_type }}" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }}

      - name: Run the shard
        # Pinned to one BLAS thread so a runner's core count cannot change what
        # the timing columns report between one reference and the next.
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python matchmaker_eval/run_submission.py \
            --method "${{ matrix.job.method }}" \
            --input-type "${{ matrix.job.input_type }}" \
            --fold "$FOLD" \
            --shard ${{ matrix.job.shard }} \
            --num-shards ${{ needs.plan.outputs.num_shards }} \
            --output "results/shards/current"

      - uses: actions/upload-artifact@v4
        with:
          name: refshard-${{ matrix.job.method }}-${{ matrix.job.input_type }}-${{ matrix.job.shard }}
          path: results/shards/current
          retention-days: 14

  merge:
    name: main / merge
    needs: [plan, evaluate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep preview files outside the code checkout
        run: echo "MATCHMAKER_RESULTS_DIR=$RUNNER_TEMP/benchmark-preview" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the merge needs
        run: |
          python .github/install_matchmaker.py
          pip install --quiet pyyaml pydantic-settings

      - uses: actions/download-artifact@v4
        with:
          pattern: refshard-*
          path: results/refshards

      - name: Merge each reference
        # One run produces shards for many entries; this regroups them by entry
        # and merges each separately. An entry missing shards stays partial and
        # off the leaderboard.
        env:
          EXPECTED_ENTRIES: ${{ needs.plan.outputs.entries }}
        run: python matchmaker_eval/merge_references.py results/refshards --fold "$FOLD" --output "${{ needs.plan.outputs.results_root }}" --expected-entries-json "$EXPECTED_ENTRIES"

      - name: Upload the complete merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ env.FOLD }}
          path: ${{ needs.plan.outputs.results_root }}
          if-no-files-found: error
          retention-days: 30

      - name: Stage the piano results for the leaderboard
        if: env.FOLD == 'eval'
        run: |
          mkdir -p "$MATCHMAKER_RESULTS_DIR/submissions"
          cp -a "${{ needs.plan.outputs.results_root }}/." "$MATCHMAKER_RESULTS_DIR/submissions/"

      - name: Export the per-piece detail
        if: env.FOLD == 'eval'
        run: python matchmaker_eval/export_details.py

      - name: Rebuild the leaderboard
        if: env.FOLD == 'eval'
        run: python matchmaker_eval/leaderboard.py

      - name: Assemble the site for review
        if: env.FOLD == 'eval'
        run: python matchmaker_eval/build_site.py _site

      - uses: actions/upload-artifact@v4
        if: env.FOLD == 'eval'
        with:
          name: leaderboard-site
          path: _site
          retention-days: 14
